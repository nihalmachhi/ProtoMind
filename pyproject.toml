[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protomind"
version = "0.1.0"
description = "Authorized protocol discovery from captures and controlled lab protocols"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3", "scapy>=2.6,<3", "python-multipart>=0.0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "hypothesis>=6.112,<7", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.hatch.build.targets.wheel]
packages = ["protomind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
